name: Validate MX Touchpad Gestures

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test gesture logic and device integration
        run: python3 -m unittest -q test_gestures.py test_setup.py
      - name: Compile Python modules
        run: python3 -m py_compile mxmaster3_gestures.py mxmaster3_gestures_settings.py mxmaster3_gesture_config.py mxmaster3_gesture_device.py mxmaster3_gesture_setup.py solaar_bridge.py
      - name: Check shell syntax and native helper
        run: |
          bash -n PKGBUILD mx-touchpad-gestures.install mxmaster3-gestures-setup
          cc -std=c11 -Wall -Wextra -Werror -o /tmp/mxmaster3-gesture-signal fast_signal.c
      - name: Install GNOME UI test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 gsettings-desktop-schemas
      - name: Smoke-test native libadwaita window
        env:
          GDK_BACKEND: x11
          GSETTINGS_BACKEND: memory
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest -q test_ui.py
      - name: Verify Arch package source checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          pkg = Path('PKGBUILD').read_text()
          sources = re.search(r"source=\((.*?)\)\s*sha256sums=", pkg, re.S).group(1)
          sums = re.search(r"sha256sums=\((.*?)\)\s*build\(", pkg, re.S).group(1)
          files = re.findall(r"'([^']+)'", sources)
          digests = re.findall(r"'([a-f0-9]{64})'", sums)
          assert len(files) == len(digests) and len(files) == len(set(files)), "Package file list mismatch"
          for path, digest in zip(files, digests):
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert digest == actual, f"Wrong checksum for {path}"
          print(f"Verified {len(files)} packaged source checksums")
          PY
